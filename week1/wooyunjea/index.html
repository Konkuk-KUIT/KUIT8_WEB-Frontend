<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danggn</title>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./index.css" />
    <script src="./script.js" defer></script>
  </head>

  <body>
    <!--상단 헤더-->
    <header class="mydanggn-header">
      <div class="titletext">나의 당근</div>
      <img src="./assets/settings.svg" alt="설정 버튼" />
    </header>

    <!--프로필-->
    <article class="profile">
      <section class="profile-info">
        <img src="./assets/userimage.svg" alt="프로필 이미지" />
        <div class="profile-name">
          <p class="nametext">가나다</p>
          <p class="text-gray-1">군자동 #123456789</p>
        </div>
        <img src="./assets/forward.svg" alt="화살표" />
      </section>

      <section class="danggnpay">
        <p class="text-orange">당근페이</p>
        <p class="text-gray-2">중고거래는 이제 당근페이로 해보세요!</p>
      </section>

      <section class="profile-record">
        <div class="button-profile">
          <div class="button-profile-stage">
            <img src="./assets/bill.svg" alt="판매내역" />
          </div>
          <p class="text-black-1">판매내역</p>
        </div>
        <div class="button-profile">
          <div class="button-profile-stage">
            <img src="./assets/shoppingbag.svg" alt="구매내역" />
          </div>
          <p class="text-black-1">구매내역</p>
        </div>
        <div class="button-profile">
          <div class="button-profile-stage">
            <img src="./assets/heart.svg" alt="관심목록" />
          </div>
          <p class="text-black-1">관심목록</p>
        </div>
      </section>
    </article>
    <!--나의 활동-->

    <!--우리 동네-->

    <!--바텀바-->
  </body>
</html>
