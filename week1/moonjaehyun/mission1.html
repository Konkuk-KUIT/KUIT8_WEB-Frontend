<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danggn</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="mission1.css" />
    <script src="./mission1.js" defer></script>
  </head>
  <body>
    <header class="setting-header">
      <span class="setting-header__text">나의 당근</span>
      <img src="./assets/settings.svg" alt="" class="setting-header__icon" />
    </header>
    <article class="my-danggn">
      <div class="simple-info">
        <div class="user-info">
          <div class="user-info__profile">
            <img src="https://placehold.co/64" alt="" class="user-img" />
          </div>
          <div class="user-content">
            <div class="user-name">
              <button class="user-name-text">가나다</button>
                <input type="text" class="user-name-input disable" placeholder="닉네임을 입력해주세요" value="가나다"></input>
                <button class="user-name-button disable">수정</button>
            </div>
            <span class="user-info">군자동 #123456789</span>
          </div>
          <div class="user-info__icon">
            <img src="./assets/forward.svg" alt="" class="icon-forward" />
          </div>
        </div>
        <div class="danggn-pay">
          <span class="danggn-pay__title"> 당근페이 </span>
          <span class="danggn-pay__description">
            중고거래는 이제 당근페이로 해보세요!
          </span>
        </div>
        <div class="list">
          <div class="list-item" id="sell-list">
            <button class="sell-icon">
              <img src="./assets/bill.svg" alt="" />
            </button>
            <span class="sell-text">판매내역</span>
          </div>
          <div class="list-item" id="buy-list">
            <button class="buy-icon">
              <img src="./assets/shopping_bag.svg" alt="" />
            </button>
            <span class="buy-text">구매내역</span>
          </div>
          <div class="list-item" id="like-list">
            <button class="like-icon">
              <img src="./assets/heart_orange.svg" alt="" />
            </button>
            <span class="like-text">관심목록</span>
          </div>
        </div>
      </div>
      <div class="my-activity">
        <div class="list-title">
          <span class="list-title__text">나의 활동</span>
        </div>
        <div class="list-item">
          <img src="./assets/news.svg" alt="news" class="list-item__icon" />
          <span class="list-item__name">내 동네 설정</span>
        </div>
        <div class="list-item">
          <img src="./assets/news.svg" alt="news" class="list-item__icon" />
          <span class="list-item__name">동네 인증하기</span>
        </div>
        <div class="list-item">
          <img src="./assets/news.svg" alt="news" class="list-item__icon" />
          <span class="list-item__name">키워드 알림</span>
        </div>
        <div class="list-item">
          <img src="./assets/news.svg" alt="news" class="list-item__icon" />
          <span class="list-item__name">모아보기</span>
        </div>
        <div class="list-item">
          <img src="./assets/news.svg" alt="news" class="list-item__icon" />
          <span class="list-item__name">당근가계부</span>
        </div>
      </div>
      <div class="our-neighborhood">
        <div class="list-title">
          <span class="list-title__text">우리 동네</span>
        </div>
        <div class="list-item">
          <img src="./assets/news.svg" alt="news" class="list-item__icon" />
          <span class="list-item__name">동내생활 글/댓글</span>
        </div>
        <div class="list-item">
          <img src="./assets/news.svg" alt="news" class="list-item__icon" />
          <span class="list-item__name">동네홍보 글</span>
        </div>
      </div>
    </article>
    <footer class="footer">
      <div class="footer-item">
        <img src="./assets/home.svg" alt="" class="item-icon" />
        <span class="item-name">홈</span>
      </div>
      <div class="footer-item">
        <img src="./assets/news.svg" alt="" class="item-icon" />
        <span class="item-name">동네생활</span>
      </div>
      <div class="footer-item">
        <img src="./assets/place_marker.svg" alt="" class="item-icon" />
        <span class="item-name">내 근처</span>
      </div>
      <div class="footer-item">
        <img src="./assets/chat.svg" alt="" class="item-icon" />
        <span class="item-name">채팅</span>
      </div>
      <div class="footer-item">
        <img src="./assets/user.svg" alt="" class="item-icon" />
        <span class="item-name">나의 당근</span>
      </div>
    </footer>
  </body>
</html>
