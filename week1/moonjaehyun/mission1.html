<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danggn</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="mission1.css" />
    <script src="./scripts.js" defer></script>
  </head>
  <body>
    <header class="setting-header">
      <span class="setting-header__text">나의 당근</span>
      <img src="./assets/settings.svg" alt="" class="setting-header__icon" />
    </header>
    <article class="my-danggn">
      <div class="simple-info">
        <div class="user-info">
          <div class="user-info__profile">
            <img src="https://placehold.co/64" alt="" class="user-img" />
          </div>
          <div class="user-content">
            <span class="user-name">가나다</span>
            <span class="user-info">군자동 #123456789</span>
          </div>
          <div class="user-info__icon">
            <img src="./assets/forward.svg" alt="" class="icon-forward" />
          </div>
        </div>
        <div class="danggn-pay">
          <span class="danggn-pay__title"> 당근페이 </span>
          <span class="danggn-pay__description">
            중고거래는 이제 당근페이로 해보세요!
          </span>
        </div>
        <div class="list">
          <div class="sell-list">
            <button class="sell-icon">
              <img src="./assets/Bill.png" alt="" />
            </button>
            <span class="sell-text"></span>
          </div>
          <div class="buy-list">
            <button class="buy-icon">
              <img src="./assets/Shopping Bag.png" alt="" />
            </button>
            <span class="buy-text"></span>
          </div>
          <div class="like-list">
            <button class="like-icon">
              <img src="./assets/Heart.png" alt="" />
            </button>
            <span class="like-text"></span>
          </div>
        </div>
      </div>
      <div class="my-activity">
        <div class="list-title">나의 활동</div>
        <div class="list-item">
          <img src="" alt="" class="list-item__icon" />
          <span class="list-item__name">내 동네 설정</span>
        </div>
        <div class="list-item">
          <img src="" alt="" class="list-item__icon" />
          <span class="list-item__name">내 동네 설정</span>
        </div>
        <div class="list-item">
          <img src="" alt="" class="list-item__icon" />
          <span class="list-item__name">내 동네 설정</span>
        </div>
        <div class="list-item">
          <img src="" alt="" class="list-item__icon" />
          <span class="list-item__name">내 동네 설정</span>
        </div>
        <div class="list-item">
          <img src="" alt="" class="list-item__icon" />
          <span class="list-item__name">내 동네 설정</span>
        </div>
      </div>
      <div class="our-neighborhood">
        <div class="list-title"></div>
        <div class="list-item">
          <img src="" alt="" class="list-item__icon" />
          <span class="list-item__name">내 동네 설정</span>
        </div>
        <div class="list-item">
          <img src="" alt="" class="list-item__icon" />
          <span class="list-item__name">내 동네 설정</span>
        </div>
      </div>
    </article>
    <footer></footer>
  </body>
</html>
