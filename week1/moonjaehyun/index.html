<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danggn</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header class="chat-header">
      <div class="chat-header__title">채팅</div>
      <div class="chat-header__icons">
        <img src="assets/camera.svg" alt="카메라 버튼" />
        <img src="assets/alarm.svg" alt="알람 버튼" />
      </div>
    </header>
    <!-- 채팅 목록 -->
    <article class="chat-list">
      <section class="chat-post">
        <div class="chat-post__user"></div>
        <img src="" alt="" class="user-img" />
        <div class="chat-content">
          <div class="chat-info">
            <span class="user-name">요우</span>
            <span class="user-info"></span>
          </div>
          <div class="chat-text"></div>
        </div>
        <div class="product">
          <img src="" alt="" class="product-img" />
        </div>
      </section>
    </article>
    <!-- 하단 바-->
  </body>
</html>
