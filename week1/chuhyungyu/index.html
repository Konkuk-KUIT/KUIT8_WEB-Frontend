<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Danggn</title>
        <link rel="stylesheet" href="./reset.css"/>
        <link rel="stylesheet" href="./index.css"/>
        <script src="./script.js" defer></script>
    </head>
    <body>
        <!-- 상단 헤더 -->
        <header class="my-header">
            <div class="my-header__title">나의 당근</div>
            <div class="my-header__icons">
                <img src="./assets/setting.svg" alt="설정 버튼">
            </div>
        </header>

        <!-- 메인 상단영역 -->
        <section class="my-menu">
            <div class="my-info">
                <img src="./assets/profile.svg" alt="내 프로필 사진">
                <span class="my-name name-button">가나다</span>
                <span class="my-id">군자동 #123456789</span>
                <img src="./assets/right-arrow.svg" alt="오른쪽 화살표">
            </div>
            <div class="danggn-pay">
                <span class="pay-title">당근페이</span>
                <span class="pay-content">중고거래는 이제 당근페이로 해보세요!</span>
            </div>
            <div class="my-actions">
                <div class="action-item">
                    <button class="sales-button">
                        <img src="./assets/receipt.svg" alt="판매내역">
                    </button>
                    <span class="action-info">판매내역</span>
                </div>
                <div class="action-item">
                    <button class="buy-button">
                        <img src="./assets/shopping-bag.svg" alt="구매내역">
                    </button>
                    <span class="action-info">구매내역</span>
                </div>
                <div class="action-item">
                    <button class="interest-button">
                        <img src="./assets/heart.svg" alt="관심목록">
                    </button>
                    <span class="action-info">관심목록</span>
                </div>
            </div>
        </section>

        <!-- 메인 하단영역 -->
        <section class="menu-section">
            <span class="menu-title">나의 활동</span>
            <div class="menu-item">
                <img src="./assets/article.svg" alt="메뉴">
                <span class="menu-item-info">내 동네 설정</span>
            </div>
            <div class="menu-item">
                <img src="./assets/article.svg" alt="메뉴">
                <span class="menu-item-info">동네 인증하기</span>
            </div>
            <div class="menu-item">
                <img src="./assets/article.svg" alt="메뉴">
                <span class="menu-item-info">키워드 알림</span>
            </div>
            <div class="menu-item">
                <img src="./assets/article.svg" alt="메뉴">
                <span class="menu-item-info">모아보기</span>
            </div>
            <div class="menu-item">
                <img src="./assets/article.svg" alt="메뉴">
                <span class="menu-item-info">당근 가계부</span>
            </div>
        </section>
        
        <section class="menu-section">
            <span class="menu-title">우리동네</span>
            <div class="menu-item">
                <img src="./assets/article.svg" alt="메뉴">
                <span class="menu-item-info">동네생활 글/댓글</span>
            </div>
            <div class="menu-item">
                <img src="./assets/article.svg" alt="메뉴">
                <span class="menu-item-info">동네홍보 글</span>
            </div>
        </section>

        <!-- 하단 바 -->
        <nav class="bottom-bar">
            <div class="bar-content">
                <button>
                    <img src="./assets/home.svg" alt="홈">
                    <span class="bar-info">홈</span>
                </button>
                <button>
                    <img src="./assets/article.svg" alt="동네생활">
                    <span class="bar-info">동네생활</span>
                </button>
                <button>
                    <img src="./assets/map-pin.svg" alt="내 근처">
                    <span class="bar-info">내 근처</span>
                </button>
                <button>
                    <img src="./assets/map-pin.svg" alt="채팅">
                    <span class="bar-info">채팅</span>
                </button>
                <button>
                    <img src="./assets/user.svg" alt="나의 당근">
                    <span class="bar-info">나의 당근</span>
                </button>
            </div>
        </nav>
    </body>
</html>
