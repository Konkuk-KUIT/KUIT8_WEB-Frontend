<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danggn</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="index.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <!-- 상단 헤더 -->
     <header class="myPage-header">
        <p class="myPage-header__title">나의 당근</p>
        <img src="./assets/settings.png" alt="설정 버튼" class="myPage-header__setting">
        </header>
    <!-- profile-->
     <div class="myPage-profile">
        <div class="myPage-profile__info">
            <img src="./assets/profile.png" alt="프로필 이미지" class="myPage-profile__img">
            <div class="myPage-profile__text">
                <div class="myPage-profile__name-div">
                    <p class="myPage-profile__name">가나다</p>
                </div>
                <p class="myPage-profile__location">군자동 #123456789</p>
            </div>
            <img src="./assets/Forward.png" alt="화살표 버튼" class="myPage-profile__arrow">
        </div>
        <div class="myPage-profile__pay">
            <p class="myPage-profile__pay__title">당근페이</p>
            <p class="myPage-profile__pay__desc">중고거래는 이제 당근페이로 해보세요!</p>
        </div>
        <div class="myPage-profile__menu">
            <div class="myPage-profile__menu__item">
                <div class="myPage-profile__menu__item__icon">
                    <img src="./assets/bill.png" alt="bill icon" class="myPage-profile__menu__item__img">
                </div>
                <p class="myPage-profile__menu__item__text">판매내역</p> 
            </div>
            <div class="myPage-profile__menu__item">
                <div class="myPage-profile__menu__item__icon">
                    <img src="./assets/shopping bag.svg" alt="bag icon" class="myPage-profile__menu__item__img">
                </div>
                <p class="myPage-profile__menu__item__text">구매내역</p> 
            </div>
            <div class="myPage-profile__menu__item">
                <div class="myPage-profile__menu__item__icon">
                    <img src="./assets/heart.svg" alt="heart icon" class="myPage-profile__menu__item__img">
                </div>
                <p class="myPage-profile__menu__item__text">관심목록</p> 
            </div>
        </div>
     </div>
     <!-- activitis-->
      <div class="list-section">
        <div class="list-section__title">
            <p class="list-section__title__text">나의 활동</p>
        </div>
        <div class="list-section__item">
            <img src="./assets/news.svg" alt="뉴스 아이콘" class="list-section__item__img">
            <p class="list-section__item__text">내 동네 설정</p>
        </div>
        <div class="list-section__item">
            <img src="./assets/news.svg" alt="뉴스 아이콘" class="list-section__item__img">
            <p class="list-section__item__text">동네 인증하기</p>
        </div>
        <div class="list-section__item">
            <img src="./assets/news.svg" alt="뉴스 아이콘" class="list-section__item__img">
            <p class="list-section__item__text">키워드 알림</p>
        </div>
        <div class="list-section__item">
            <img src="./assets/news.svg" alt="뉴스 아이콘" class="list-section__item__img">
            <p class="list-section__item__text">모아보기</p>
        </div>
        <div class="list-section__item">
            <img src="./assets/news.svg" alt="뉴스 아이콘" class="list-section__item__img">
            <p class="list-section__item__text">당근가계부</p>
        </div>
      </div>
      <!-- Neighborhood -->
       <div class="list-section">
            <div class="list-section__title">
                <p class="list-section__title__text">우리 동네</p>
            </div>
            <div class="list-section__item">
                <img src="./assets/news.svg" alt="뉴스 아이콘" class="list-section__item__img">
                <p class="list-section__item__text">동네생활 글/댓글</p>
            </div>
            <div class="list-section__item">
                <img src="./assets/news.svg" alt="뉴스 아이콘" class="list-section__item__img">
                <p class="list-section__item__text">동네홍보 글</p>
            </div>
            <div class="list-section__item">
                <img src="./assets/news.svg" alt="뉴스 아이콘" class="list-section__item__img">
                <p class="list-section__item__text">동네 가게 후기</p>
            </div>
            <div class="list-section__item">
                <img src="./assets/news.svg" alt="뉴스 아이콘" class="list-section__item__img">
                <p class="list-section__item__text">저장한 장소</p>
            </div>
            <div class="list-section__item">
                <img src="./assets/news.svg" alt="뉴스 아이콘" class="list-section__item__img">
                <p class="list-section__item__text">내 단골 가게</p>
            </div>
            <div class="list-section__item">
                <img src="./assets/news.svg" alt="뉴스 아이콘" class="list-section__item__img">
                <p class="list-section__item__text">받은 쿠폰함</p>
            </div>
       </div>
      <!-- footer -->
       <footer class="myPage-footer">
            <div class="myPage-footer__item">
                <img src="./assets/Home.svg" alt="집 모양 아이콘" class="myPage-footer__item__img">
                <p class="myPage-footer__item__text">홈</p>
            </div>
            <div class="myPage-footer__item">
                <img src="./assets/news.svg" alt="뉴스 아이콘" class="myPage-footer__item__img">
                <p class="myPage-footer__item__text">동네생활</p>
            </div>
            <div class="myPage-footer__item">
                <img src="./assets/Place Marker.svg" alt="장소 마커" class="myPage-footer__item__img">
                <p class="myPage-footer__item__text">내 근처</p>
            </div>
            <div class="myPage-footer__item">
                <img src="./assets/Chat.svg" alt="채팅 아이콘" class="myPage-footer__item__img">
                <p class="myPage-footer__item__text">채팅</p>
            </div>
            <div class="myPage-footer__item">
                <img src="./assets/user.png" alt="유저 아이콘" class="myPage-footer__item__img">
                <p class="myPage-footer__item__text">나의 당근</p>
            </div>
        </footer>
</body>
</html>
