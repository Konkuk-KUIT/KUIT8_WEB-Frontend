<!DOCTYPE html>
<html lang="en">

<head>
  <title>당근 마켓 화면 3</title>
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="index.css">
  <script src="script.js" defer></script>
</head>

<body>
  <header>
    <div class="settings">
      <div class="my-carrot">나의 당근</div>
      <div class="setting-button">
        <img src="./assets/setting.svg" alt="환경설정 버튼">
      </div>
    </div>
    <section class="my-info">
      <div class="my-profile">
        <div class="proifle-image">
          <img src="assets/profile-img.svg">
        </div>
        <div class="profile-info">
          <div class="profile-name">
            <div class="name">
              가나다
            </div>
            <input class="name-input" type="text">
            <button class="name-modify">
              수정
            </button>
          </div>
          
          <span class="profile-tag">
            군자동 #123456789
          </span>
        </div>
        <div class="profile-arrow">
          <img src="assets/arrow.png" alt="화살표 사진">
        </div>
      </div>
      <div class="carrot-pay">
        <div class="carrot-pay-word">
          당근페이
        </div>
        <div class="carrot-pay-explain">
          중고거래는 이제 당근페이로 해보세요!
        </div>
      </div>
      <div class="my-history">

        <div class="my-sell-history">
          <div class="sell-history">
            <img src="assets/bill.svg">
          </div>
          <span class="sell-history-word">
            판매내역
          </span>
        </div>

        <div class="my-buy-history">
          <div class="buy-history">
            <img src="assets/bag.svg">
          </div>
          <span class="buy-history-word">
            구매내역
          </span>
        </div>

        <div class="my-interest-list">
          <div class="interest-list">
            <img src="assets/heart.svg">
          </div>
          <span class="interst-list-word">
            관심목록
          </span>
        </div>
      </div>
    </section>
  </header>

  <div class="bar">
  </div>

  <section class="my-list">
    <div class="list-explain">
      나의 활동
    </div>
    <div class="my-list-item">
      <img src="assets/news.svg" alt="뉴스 사진">
      <span class="list-item-explain">내 동네 설정</span>
    </div>
    <div class="my-list-item">
      <img src="assets/news.svg" alt="뉴스 사진">
      <span class="list-item-explain">동네 인증하기</span>

    </div>
    <div class="my-list-item">
      <img src="assets/news.svg" alt="뉴스 사진">
      <span class="list-item-explain">키워드 알림</span>
    </div>
    <div class="my-list-item">
      <img src="assets/news.svg" alt="뉴스 사진">
      <span class="list-item-explain">모아보기</span>
    </div>
    <div class="my-list-item">
      <img src="assets/news.svg" alt="뉴스 사진">
      <span class="list -item-explain">당근 가계부</span>
    </div>
  </section>

  <div class="bar">
  </div>

  <section class="my-list">
    <div class="list-explain">
      우리 동네
    </div>
    <div class="my-list-item">
      <img src="assets/news.svg" alt="뉴스 사진">
      <span class="list-item-explain">동네 생활 글/댓글</span>
    </div>
    <div class="my-list-item">
      <img src="assets/news.svg" alt="뉴스 사진">
      <span class="list-item-explain">동네홍보 글</span>
    </div>
  </section>

  <div class="bar">
  </div>

</body>
<nav class="bottom-nav">
  <div class="nav-item">
    <div class="nav-item-icon">
      <img src="assets/bottom-bar/home.svg" alt="집 사진">
    </div>
    <span class="nav-item-icon-explain">
      홈
    </span>
  </div>

  <div class="nav-item">
    <div class="nav-item-icon">
      <img src="assets/news.svg" alt="뉴스 사진">
    </div>
    <span class="nav-item-icon-explain">
      동네생활
    </span>
  </div>

  <div class="nav-item">
    <div class="nav-item-icon">
      <img src="assets/bottom-bar/gps.svg" alt="gps 사진">
    </div>
    <span class="nav-item-icon-explain">
      내 근처
    </span>
  </div>

  <div class="nav-item">
    <div class="nav-item-icon">
      <img src="assets/bottom-bar/chat.svg" alt="chat 사진">
    </div>
    <span class="nav-item-icon-explain">
      채팅
    </span>
  </div>

  <div class="nav-item">
    <div class="nav-item-icon">
      <img src="assets/bottom-bar/user.svg" alt="나의 당근 사진">
    </div>
    <span class="nav-item-icon-explain">
      나의 당근
    </span>
  </div>

</nav>

</html>
